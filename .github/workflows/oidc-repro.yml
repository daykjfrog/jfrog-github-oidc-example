name: JFrog OIDC repro

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
        with:
          oidc-provider-name: github-oidc-dy
          oidc-audience: jfrog-github

      - name: Prove OIDC login
        run: jf rt ping

      - name: Checksum search (customer hop)
        run: |
          SHA=$(jf rt curl -s /api/storage/dayk-fed-gen/new.txt | jq -r '.checksums.sha256')
          echo "sha256=${SHA}"
          jf rt curl -sD - "/api/search/checksum?sha256=${SHA}"
